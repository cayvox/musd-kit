# Deploy the combined musdkit.xyz site (Astro landing at / + VitePress docs at /docs).
#
# MANUAL ONLY (workflow_dispatch), this never runs on push. Go-live is Anıl's step,
# AFTER the matching npm publish, so the hero `npm install` is real and the live widget
# reads through the published package. 0.1.0 shipped this way; 0.2.0 follows the same order.
#
# Prerequisites (repo secrets) before the first manual run:
#   CLOUDFLARE_API_TOKEN, Pages:Edit token
#   CLOUDFLARE_ACCOUNT_ID, the Cloudflare account id
#   PUBLIC_MEZO_TESTNET_RPC_URL (optional), overrides the default public testnet RPC
# And: a Cloudflare Pages project named `musdkit` mapped to musdkit.xyz (DNS = Anıl's step).
name: Deploy site

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to confirm a production deploy of musdkit.xyz'
        required: true
        default: ''

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event.inputs.confirm == 'deploy' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      # RUNTIME: already declared here rather than read from `.nvmrc`, which is the rule
      # (`docs/08-conventions.md` §1), so this job was not touched when the other four were
      # decoupled. Both things an earlier wave left open here are now decided (MK-044): `20`
      # was a floating major AND Node 20 reached end of life on 2026-04-30. It is pinned to
      # 24.19.0, the same exact version the fork gate declares, so the site is built on the
      # runtime the tests ran on rather than on an unsupported one. `actions/setup-node` moves
      # to v5 for the same reason: every other workflow is already there, and one workflow on
      # a different major is a difference nobody would think to look for.
      - uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build combined site
        env:
          PUBLIC_MEZO_TESTNET_RPC_URL: ${{ secrets.PUBLIC_MEZO_TESTNET_RPC_URL }}
        run: bash scripts/build-site.sh

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy landing/dist --project-name=musdkit --branch=main
