# MAINTAINER: add the repo secret `MEZO_TESTNET_RPC_URL` (Settings → Secrets and
# variables → Actions). It must be a Mezo Testnet RPC (chainId 31611), e.g. the
# public endpoint https://rpc.test.mezo.org or your own provider. The fork harness
# reads it from the environment and never hardcodes a URL.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the anvil fork to a fixed Mezo testnet block (MK-016). Unpinned, the harness
  # forks at `latest`, so the suite runs against whatever live testnet state exists at
  # that moment: Trove population, the sorted list, and the oracle round all drift under
  # it, and a run that fails cannot be reproduced. The harness reads this name from the
  # environment (`packages/core/test/harness/anvil.ts:83`) and passes it to anvil as
  # `--fork-block-number`.
  #
  # HOW TO BUMP: pick a recent FINALIZED block on Mezo testnet
  #   curl -s -X POST -H 'content-type: application/json' \
  #     --data '{"jsonrpc":"2.0","id":1,"method":"eth_getBlockByNumber","params":["finalized",false]}' \
  #     "$MEZO_TESTNET_RPC_URL"
  # and replace the number below. Bump when the suite needs newer chain state, or when
  # the RPC provider has pruned the state at this block and forking here starts failing.
  # Bumping is a deliberate act: it changes the fixture the whole fork suite runs against,
  # so it belongs in its own commit with the reason stated.
  MEZO_FORK_BLOCK: '15043414' # finalized 2026-08-22

jobs:
  # Cheap, deterministic, chain-free. Runs across the Node range the packages advertise
  # in `engines` (>=20.20.2), so resolution drift is caught before users hit it. This is
  # the matrix `docs/07-testing.md` §5 describes; keep the two in sync.
  checks:
    name: Checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Checked against the nodejs/Release schedule, not assumed: 24 is Active LTS, 22 is
        # Maintenance LTS, and 20 reached END OF LIFE on 2026-04-30. 20 stays anyway,
        # because users are still on it, and it is the floor `engines.node` advertises
        # (>=20.20.2, the final Node 20 release, which this leg resolves to).
        # `engines` states what we TEST; `.nvmrc` states what we DEVELOP ON, and that now
        # tracks the Active LTS. See `docs/08-conventions.md` §1 and `docs/07-testing.md` §5.
        node: ['20', '22', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      # Guardrail: no absolute machine paths (a developer home dir or a Windows drive) or brittle
      # pnpm-internal references in tracked source/config/scripts. They break on other machines and CI.
      - name: Check for absolute machine paths
        run: pnpm check:paths

      # Build first: @musd-kit/react typechecks against @musd-kit/core's built types
      # (dist/index.d.ts), so the workspace must be built before the cross-package typecheck.
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Reference apps (Phase 9), built/typechecked but NOT published. The keeper's
      # no-React boundary + its real fork liquidation run in the fork gate below.
      - name: Build examples
        run: pnpm -r --filter "./examples/*" build

      - name: Typecheck examples
        run: pnpm -r --filter "./examples/*" typecheck

      # Deliberately BEFORE any Foundry install and with no RPC secret in scope: this step
      # is the proof that the unit project needs neither a chain nor an anvil binary
      # (MK-015, MK-016). If it ever starts needing one, it fails here.
      - name: Unit tests (no chain, no anvil, no RPC URL)
        run: pnpm test:unit

  # The expensive half: one shared anvil fork of Mezo, at the pinned block, on the pinned
  # toolchain. Not matrixed, the fork gate is chain-bound, not runtime-bound.
  fork-gate:
    name: Fork gate + coverage
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      # anvil lazily fetches upstream state on first access and persists it, per pinned
      # block, under ~/.foundry/cache/rpc/<chainId>/<block>/ (MK-021). Without this, CI is
      # cold on every push: one `computeHints` warm-up alone cost 913 upstream JSON-RPC
      # calls, 849 of them eth_getStorageAt, versus 3 once cached.
      #
      # DETERMINISM: both the cache PATH and the cache KEY carry the block number, so a
      # cache entry can never be reused across blocks. That matters: state cached at one
      # block and replayed at another is exactly the nondeterminism MK-020 removed. There
      # is deliberately NO `restore-keys` fallback here, because a prefix match would
      # restore a different block's entry.
      - name: Cache anvil fork state (per pinned block)
        uses: actions/cache@v4
        with:
          path: ~/.foundry/cache/rpc/31611/${{ env.MEZO_FORK_BLOCK }}
          key: anvil-fork-31611-${{ env.MEZO_FORK_BLOCK }}

      # Both projects, with the coverage gate for @musd-kit/core. The floor is configured
      # in `vitest.config.mts` and is a ratchet: it only moves up.
      - name: Test (forked-Mezo gate) + coverage floor
        run: pnpm test:coverage
        env:
          MEZO_TESTNET_RPC_URL: ${{ secrets.MEZO_TESTNET_RPC_URL }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: warn

      # Pack the two public packages and prove a clean install works (ESM + CJS + types) in a
      # fresh project, with the tarballs shipping only dist + README + LICENSE. Runs BEFORE and
      # WITHOUT publishing, from packed tarballs; the genuinely post-publish check (install from
      # the registry) lives in `release.yml`, after the publish step.
      - name: Pre-publish smoke (pack + clean-install, no publish)
        run: bash scripts/release-smoke.sh

      # Build the combined site (SDK + Astro landing + TypeDoc API ref + VitePress docs assembled
      # under /docs) and run the internal-link check, which fails on any 404, including every
      # landing -> docs link. This guards the docs/API routing against future regressions.
      - name: Build combined site + check links
        run: pnpm build:site
