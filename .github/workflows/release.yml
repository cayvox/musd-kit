# Publish @musd-kit/core + @musd-kit/react to npm with provenance.
#
# THIS WORKFLOW IS NOT RUN AUTOMATICALLY, it is the deliberate, credentialed go-live.
#
# 0.1.0 shipped from here on 2026-06-22. The steps below were the FIRST publish checklist and
# steps 1 and 2 are already done; step 3 is the one that repeats for every release.
#
# Before the first publish, the maintainer (Anıl) must:
#   1. Make the GitHub repo `cayvox/musd-kit` PUBLIC, npm provenance (--provenance) signs
#      the build via OIDC and generally requires a public repo. (The grant narrative is
#      public-good infrastructure anyway.) If you choose to stay private / skip provenance
#      for the first publish, drop `--provenance` from the publish step and the
#      `id-token: write` permission below.
#   2. Add the `NPM_TOKEN` repository secret (an npm automation token with publish rights to
#      the @musd-kit scope).
#   3. Trigger this workflow (Actions → Release → Run workflow), or push a `v*` tag.
#
# It builds + runs the forked-Mezo gate, then publishes only the two PUBLIC packages
# (examples/docs are private and skipped).
name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm provenance (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      # Handed to the verification workflow, so it checks the version this job actually
      # published rather than re-deriving it from a checkout that could have moved.
      version: ${{ steps.ver.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # RUNTIME: declared here, NOT inherited from `.nvmrc`, so that a change to the
      # development pin can never silently change the runtime that builds and signs a
      # published artifact. Same version as the CI fork gate, deliberately: the gate that
      # proves a release is the gate that must run on the release runtime (MK-029).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # PINNED, not `stable` (MK-041). `stable` floats: Foundry shipped anvil 1.8.0 on
      # 2026-08-27 and the fork gate went from green on 1.7.1 to red about two hours later,
      # on a commit that changed one markdown file. anvil 1.8.0 answers `eth_call` against
      # this fork with `Excess blob gas not set` (-32602) before a single test runs, so the
      # suite reports "no tests" and the coverage gate reports 0%. Both runs restored the
      # same fork cache, so the cache was not it; the toolchain version was the only input
      # that differed. This is MK-029 one level over: the Node version was pinned then, and
      # the Foundry version was left floating. Bump it deliberately, in its own commit, and
      # read the run.
      - name: Install Foundry (anvil)
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: 1.7.1

      # Both projects (unit + fork). Deliberately NOT pinned to `MEZO_FORK_BLOCK` the way
      # `ci.yml` is: CI wants a reproducible fixture, a release wants to know the SDK still
      # works against CURRENT testnet state before it ships. If this is red while CI is
      # green, that difference is the finding.
      - name: Test (forked-Mezo gate, unpinned against current testnet state)
        run: pnpm test
        env:
          MEZO_TESTNET_RPC_URL: ${{ secrets.MEZO_TESTNET_RPC_URL }}

      - name: Resolve the version being published
        id: ver
        run: echo "version=$(node -p "require('./packages/core/package.json').version")" >> "$GITHUB_OUTPUT"

      # MK-055. This workflow triggers on a `v*` tag AND the runbook tells you to push such a tag
      # after publishing by dispatch, so the documented happy path re-runs the publish on a version
      # that already exists. That is a failed run rather than a bad publish, but a red release run
      # in the history is exactly the kind of thing nobody reads twice. Skip instead, and let the
      # verification job run, which turns a tag push into a re-verification of what shipped.
      - name: Is this version already on the registry?
        id: exists
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          if npm view "@musd-kit/core@$V" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "@musd-kit/core@$V is already published, skipping the publish step"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
            echo "@musd-kit/core@$V is not on the registry, publishing"
          fi

      - name: Publish to npm (provenance)
        if: steps.exists.outputs.already != 'true'
        run: pnpm publish -r --access public --provenance --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # The genuinely POST-publish check, extracted so it can be RUN (MK-053).
  #
  # It used to live here as a job with `needs: publish`, which meant the only way to execute it
  # was to publish. It never executed: it did not exist for 0.1.0, and on its first run for
  # 0.2.0 it failed in `Setup Node` before any verification step ran, because
  # `actions/setup-node` detects the pnpm lockfile and this job never installs pnpm.
  #
  # As a reusable workflow it is called here AND dispatchable on its own, so it can be proven
  # against a version that is already published without publishing anything again.
  #
  # `scripts/release-smoke.sh` (run in CI on every push) remains the PRE-publish check: it
  # installs from locally packed tarballs and never touches the registry, so it cannot catch a
  # bad publish. This can.
  verify-published:
    needs: publish
    uses: ./.github/workflows/verify-published.yml
    with:
      version: ${{ needs.publish.outputs.version }}
