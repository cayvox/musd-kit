# Install the PUBLISHED packages from the registry and prove they work (MK-053).
#
# **This is the check that never ran.** It lived inside `release.yml` as a `verify-published`
# job with `needs: publish`, which meant it could only ever execute as the tail of a real
# publish. It was written before 0.2.0, so it did not exist for the 0.1.0 release, and on its
# first and only execution it failed in `Setup Node` before a single verification step ran.
# Two releases shipped with a post publish gate that had never once produced a verdict.
#
# It is a reusable workflow now, for one reason: a gate that can only run as part of the thing
# it gates cannot be tested. `release.yml` calls it with `needs: publish`, and it can also be
# dispatched by hand against any published version, which is how it was finally proven.
#
# **No pnpm here, deliberately.** The whole value of this job is that it resolves nothing
# through the workspace: it installs from the registry with npm into an empty directory
# outside the checkout. `actions/setup-node` defaults `package-manager-cache` to true, detects
# the repository's pnpm lockfile and then fails because pnpm is not installed. Adding
# `pnpm/action-setup` would fix the symptom by installing a tool this job must not use, so the
# cache is turned off instead.
name: Verify published

on:
  workflow_call:
    inputs:
      version:
        description: 'Published version to verify'
        required: true
        type: string
      commit:
        description: 'The commit the publish ran from, asserted against the provenance statement'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: 'Published version to verify, blank to use packages/core/package.json'
        required: false
        default: ''
      commit:
        description: 'Commit the publish ran from, blank to report the attested commit without asserting it'
        required: false
        default: ''

jobs:
  verify:
    name: Post-publish install from the registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # RUNTIME: declared here, NOT inherited from `.nvmrc`, so that a change to the
      # development pin can never silently change the runtime that verifies a published
      # artifact (MK-029).
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24.19.0
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false

      - name: Resolve the version to verify
        id: ver
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          if [ -z "$V" ]; then
            V="$(node -p "require('./packages/core/package.json').version")"
            echo "no version given, using packages/core/package.json: $V"
          else
            echo "verifying the version passed in: $V"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      # npm's registry read path is eventually consistent, so a fresh version can 404 for a
      # short while after publish. Poll rather than sleep a fixed amount.
      - name: Wait for the version to be visible on the registry
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          for i in $(seq 1 30); do
            if npm view "@musd-kit/core@$V" version >/dev/null 2>&1 \
               && npm view "@musd-kit/react@$V" version >/dev/null 2>&1; then
              echo "both packages visible at $V"
              exit 0
            fi
            echo "attempt $i: not visible yet, waiting"
            sleep 10
          done
          echo "FAIL: @musd-kit/core@$V / @musd-kit/react@$V never became visible" >&2
          exit 1

      # An empty directory OUTSIDE the checkout, so nothing resolves through the workspace.
      - name: Install from the registry into a clean project
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          mkdir -p "$RUNNER_TEMP/postpublish"
          cd "$RUNNER_TEMP/postpublish"
          echo '{ "name": "postpublish-check", "private": true, "version": "0.0.0" }' > package.json
          npm install --no-audit --no-fund \
            "@musd-kit/core@$V" "@musd-kit/react@$V" \
            viem@2.22.8 react@18.2.0 react-dom@18.2.0 wagmi@2.5.12 @tanstack/react-query@5.28.4

      - name: Import the published packages (ESM + CJS)
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/postpublish"
          node --input-type=module -e "
          import { createMusdClient, MusdError, MusdErrorCode } from '@musd-kit/core'
          import { useTrove, useOpenTrove } from '@musd-kit/react'
          if (typeof createMusdClient !== 'function') throw new Error('core ESM export missing')
          if (typeof useTrove !== 'function' || typeof useOpenTrove !== 'function') throw new Error('react ESM hooks missing')
          if (typeof MusdError !== 'function' || !MusdErrorCode.BELOW_MINIMUM_DEBT) throw new Error('core errors missing')
          console.log('  published ESM ok')
          "
          node -e "
          const core = require('@musd-kit/core')
          if (typeof core.createMusdClient !== 'function') throw new Error('core CJS export missing')
          if (!core.MusdErrorCode || !core.MusdErrorCode.ICR_BELOW_MCR) throw new Error('core CJS errors missing')
          console.log('  published CJS ok')
          "

      - name: Confirm the installed version is the published one
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          cd "$RUNNER_TEMP/postpublish"
          for p in core react; do
            INSTALLED="$(node -p "require('./node_modules/@musd-kit/$p/package.json').version")"
            [ "$INSTALLED" = "$V" ] || { echo "FAIL: @musd-kit/$p resolved $INSTALLED, expected $V" >&2; exit 1; }
          done
          echo "post-publish verification PASSED at $V"

      # The published FILE LIST against the allowlist, and PROVENANCE against this repository.
      # Neither was checked before: the job proved the package imports, not that it shipped the
      # right files or that anything attested to where it came from.
      - name: Check the published file list and provenance
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          cd "$RUNNER_TEMP/postpublish"
          EXPECTED='package/LICENSE
          package/README.md
          package/dist/index.cjs
          package/dist/index.cjs.map
          package/dist/index.d.cts
          package/dist/index.d.ts
          package/dist/index.js
          package/dist/index.js.map
          package/package.json'
          for p in core react; do
            npm view "@musd-kit/$p@$V" dist.tarball -s | xargs curl -sL -o "$p.tgz"
            ACTUAL="$(tar tzf "$p.tgz" | sort)"
            if [ "$ACTUAL" != "$(echo "$EXPECTED" | sed 's/^ *//')" ]; then
              echo "FAIL: @musd-kit/$p@$V file list does not match the allowlist" >&2
              echo "$ACTUAL" >&2
              exit 1
            fi
            echo "  @musd-kit/$p@$V file list matches the allowlist"
            REPO="$(curl -sL "https://registry.npmjs.org/-/npm/v1/attestations/@musd-kit%2f$p@$V" \
              | node -e "
              let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{
                const j=JSON.parse(s);
                const a=(j.attestations||[]).find(x=>x.predicateType==='https://slsa.dev/provenance/v1');
                if(!a){console.log('NONE');return}
                const pl=JSON.parse(Buffer.from(a.bundle.dsseEnvelope.payload,'base64').toString());
                console.log(pl.predicate.buildDefinition.externalParameters.workflow.repository);
              })")"
            [ "$REPO" = "https://github.com/${{ github.repository }}" ] || {
              echo "FAIL: @musd-kit/$p@$V provenance names $REPO, expected this repository" >&2; exit 1; }
            echo "  @musd-kit/$p@$V provenance attests to $REPO"
          done

      # The rest of the provenance statement, and the two artifact checks a person was running by
      # hand after every release (MK-257). The repository line above was the only part of the
      # statement anything read: the workflow that built it, the ref it ran on, the commit and the
      # subject were all verified by someone remembering to, which is the shape MK-053 is about.
      - name: Check the provenance statement in full, against the registry
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          WANT_COMMIT='${{ inputs.commit }}'
          cd "$RUNNER_TEMP/postpublish"
          for p in core react; do
            curl -sL "https://registry.npmjs.org/-/npm/v1/attestations/@musd-kit%2f$p@$V" > "att-$p.json"
            node -e "
            const fs = require('node:fs')
            const [pkg, version, repository, wantCommit] = process.argv.slice(1)
            const j = JSON.parse(fs.readFileSync('att-' + pkg + '.json', 'utf8'))
            const a = (j.attestations || []).find(x => x.predicateType === 'https://slsa.dev/provenance/v1')
            if (!a) { console.error('FAIL: @musd-kit/' + pkg + '@' + version + ' has no SLSA provenance statement'); process.exit(1) }
            const st = JSON.parse(Buffer.from(a.bundle.dsseEnvelope.payload, 'base64').toString())
            const wf = st.predicate.buildDefinition.externalParameters.workflow
            const commit = st.predicate.buildDefinition.resolvedDependencies?.[0]?.digest?.gitCommit
            const subject = st.subject?.[0]?.name
            const fail = (m) => { console.error('FAIL: @musd-kit/' + pkg + '@' + version + ' ' + m); process.exit(1) }
            if (wf.repository !== 'https://github.com/' + repository) fail('provenance repository is ' + wf.repository)
            if (wf.path !== '.github/workflows/release.yml') fail('provenance names workflow ' + wf.path + ', expected .github/workflows/release.yml')
            if (wf.ref !== 'refs/heads/main') fail('provenance names ref ' + wf.ref + ', expected refs/heads/main')
            const want = 'pkg:npm/%40musd-kit/' + pkg + '@' + version
            if (subject !== want) fail('provenance subject is ' + subject + ', expected ' + want)
            if (!commit) fail('provenance carries no build commit')
            if (wantCommit && commit !== wantCommit) fail('provenance attests to commit ' + commit + ', expected ' + wantCommit)
            console.log('  @musd-kit/' + pkg + '@' + version + ' provenance: ' + wf.path + ' on ' + wf.ref + ' at ' + commit + (wantCommit ? ' (asserted)' : ' (reported, no commit given to assert)'))
            " "$p" "$V" "${{ github.repository }}" "$WANT_COMMIT"
          done

      # **The README npm SERVES, not the one in the tarball.** The registry document carries its own
      # copy, and it is what a person reads on npmjs.com before installing anything, so a publish
      # that ships one README and displays another is a defect no import check can see.
      - name: Compare the README the registry serves with the one in the tarball
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          cd "$RUNNER_TEMP/postpublish"
          for p in core react; do
            rm -rf "tar-$p" && mkdir -p "tar-$p"
            tar xzf "$p.tgz" -C "tar-$p"
            curl -sL "https://registry.npmjs.org/@musd-kit%2f$p" > "doc-$p.json"
            node -e "
            const fs = require('node:fs')
            const { createHash } = require('node:crypto')
            const [pkg, version] = process.argv.slice(1)
            const sha = (x) => createHash('sha256').update(x).digest('hex')
            const doc = JSON.parse(fs.readFileSync('doc-' + pkg + '.json', 'utf8'))
            const served = doc.readme ?? ''
            const shipped = fs.readFileSync('tar-' + pkg + '/package/README.md', 'utf8')
            if (doc['dist-tags']?.latest !== version) {
              console.error('FAIL: @musd-kit/' + pkg + ' latest is ' + doc['dist-tags']?.latest + ', expected ' + version)
              process.exit(1)
            }
            if (sha(served) !== sha(shipped)) {
              console.error('FAIL: @musd-kit/' + pkg + '@' + version + ' README the registry serves differs from the tarball: served sha256 ' + sha(served) + ' (' + served.length + ' bytes), shipped ' + sha(shipped) + ' (' + shipped.length + ' bytes)')
              process.exit(1)
            }
            console.log('  @musd-kit/' + pkg + '@' + version + ' README matches what npm serves, sha256 ' + sha(shipped).slice(0, 16) + ', ' + shipped.length + ' bytes, and latest is ' + version)
            " "$p" "$V"
          done

      # **Claims a closed finding retired, in the artifact npm actually delivered** (MK-246). The
      # packaging gate runs this before a publish, over locally packed tarballs; nothing ran it
      # after one, and the published 0.4.1 carried 119 such claims while the repository carried
      # none.
      #
      # **Dispatching this against a version published BEFORE a claim was retired fails, and that
      # is the correct answer**: the entries come from the checkout, so the question this step asks
      # is whether the artifact contains a sentence this tree has since retired. Over 0.4.1 it
      # reports 119 hits and exits 1.
      - name: Check the published tarballs for claims a finding retired
        run: |
          set -euo pipefail
          V='${{ steps.ver.outputs.version }}'
          cd "$RUNNER_TEMP/postpublish"
          for p in core react; do
            rm -rf "tar-$p" && mkdir -p "tar-$p"
            tar xzf "$p.tgz" -C "tar-$p"
          done
          node "$GITHUB_WORKSPACE/scripts/retired-claims.mjs" \
            "$RUNNER_TEMP/postpublish/tar-core/package" \
            "$RUNNER_TEMP/postpublish/tar-react/package"
